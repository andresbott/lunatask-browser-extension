<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lunatask Settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">

      <main class="main">
        <form id="settings-form" class="settings-form">
          <div class="form-group">
            <label for="area-id" class="form-label">
              Area ID
              <span class="form-label-hint">(required)</span>
            </label>
            <input
              type="text"
              id="area-id"
              class="form-input"
              placeholder="Enter your area ID (e.g., 4174198b-3b52-4a87-...)"
              autocomplete="off"
            />
          </div>

          <div class="form-group">
            <label for="auth-token" class="form-label">
              Auth Token
              <span class="form-label-hint">(required)</span>
            </label>
            <input
              type="password"
              id="auth-token"
              class="form-input"
              placeholder="Enter your auth token"
              autocomplete="off"
            />
            <button type="button" id="toggle-token" class="toggle-visibility">
              Show
            </button>
          </div>

          <div class="form-group">
            <label for="goal-id" class="form-label">
              Goal ID
              <span class="form-label-hint">(optional)</span>
            </label>
            <input
              type="text"
              id="goal-id"
              class="form-input"
              placeholder="Enter a goal ID to assign tasks to"
              autocomplete="off"
            />
          </div>

          <div class="form-group">
            <label for="notebook-id" class="form-label">
              Notebook ID
              <span class="form-label-hint">(optional)</span>
            </label>
            <input
              type="text"
              id="notebook-id"
              class="form-input"
              placeholder="Enter a notebook ID to save notes to"
              autocomplete="off"
            />
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-save">Save Settings</button>
          </div>

          <div id="status-message" class="status-message"></div>
        </form>
      </main>

      <footer class="footer">
        <a href="https://lunatask.app" target="_blank" rel="noopener" class="footer-link">
          lunatask.app
        </a>
      </footer>
    </div>

    <script type="module" src="index.ts"></script>
  </body>
</html>
