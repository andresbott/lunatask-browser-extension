<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lunatask Settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">

      <main class="main">
        <form id="settings-form" class="settings-form">
          <div class="form-group">
            <label for="user-id" class="form-label">
              Area ID
              <span class="form-label-hint">(required)</span>
            </label>
            <input
              type="text"
              id="user-id"
              class="form-input"
              placeholder="Enter your area ID (e.g., 4174198b-3b52-4a87-...)"
              autocomplete="off"
            />
          </div>

          <div class="form-group">
            <label for="auth-token" class="form-label">
              Auth Token
              <span class="form-label-hint">(required)</span>
            </label>
            <input
              type="password"
              id="auth-token"
              class="form-input"
              placeholder="Enter your auth token"
              autocomplete="off"
            />
            <button type="button" id="toggle-token" class="toggle-visibility">
              Show
            </button>
          </div>

          <fieldset class="form-group save-mode-group">
            <legend class="form-label">Save Mode</legend>
            <div class="radio-options">
              <label class="radio-option">
                <input type="radio" name="save-mode" value="url" checked />
                <span class="radio-label">
                  <span class="radio-title">URL only</span>
                  <span class="radio-description">Save just the page link</span>
                </span>
              </label>
              <label class="radio-option">
                <input type="radio" name="save-mode" value="content" />
                <span class="radio-label">
                  <span class="radio-title">Page content</span>
                  <span class="radio-description">Save the page as Markdown</span>
                </span>
              </label>
            </div>
          </fieldset>

          <div class="form-actions">
            <button type="submit" class="btn-save">Save Settings</button>
          </div>

          <div id="status-message" class="status-message"></div>
        </form>
      </main>

      <footer class="footer">
        <a href="https://lunatask.app" target="_blank" rel="noopener" class="footer-link">
          lunatask.app
        </a>
      </footer>
    </div>

    <script type="module" src="index.ts"></script>
  </body>
</html>
