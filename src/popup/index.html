<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Save to Lunatask</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="popup" aria-labelledby="popup-title">
    <h1 id="popup-title" class="visually-hidden">Save to Lunatask</h1>
    
    <div class="button-group" role="group" aria-label="Save options">
      <button type="button" id="save-url" class="save-btn">Save URL</button>
      <button type="button" id="save-content" class="save-btn">Attempt to save content</button>
    </div>
    
  </main>
  <script type="module" src="index.ts"></script>
</body>
</html>
