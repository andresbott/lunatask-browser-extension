<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Save to Lunatask</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="popup" aria-labelledby="popup-title">
      <h1 id="popup-title" class="visually-hidden">Save to Lunatask</h1>

      <button
        type="button"
        id="open-settings"
        class="save-btn"
        style="display: none; margin-bottom: 8px"
      >
        Open settings
      </button>
      <p id="settings-hint" class="settings-hint" style="display: none"></p>

      <div class="section-label">Save to Lunatask</div>
      <div
        id="save-actions"
        class="button-group"
        role="group"
        aria-label="Save options"
      ></div>

      <div
        id="status-announcement"
        class="visually-hidden"
        aria-live="polite"
      ></div>
    </main>
    <script type="module" src="index.ts"></script>
  </body>
</html>
